[project]
name = "abcloud"
version = "1.0.0"
description = "AB-Cloud v23 SUPERCOMBO - Python reimplementation of the 38-test verification suite"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Isaev Iskhak Khamzatovich", ORCID = "0009-0003-7299-0701" }]
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8", "mpmath>=1.3"]

[project.scripts]
abcloud = "abcloud.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
