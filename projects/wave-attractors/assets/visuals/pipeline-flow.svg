<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="84" viewBox="0 0 1200 84" role="img" aria-label="Experiment pipeline E1 to E7 with a pulse travelling along the chain">
<defs><filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1224"/><stop offset="1" stop-color="#070b16"/></linearGradient></defs>
<rect x="1.5" y="1.5" width="1197" height="81" rx="14" fill="url(#bg1)" stroke="#1c2740" stroke-width="1.4"/>
<line x1="100" y1="40" x2="1102" y2="40" stroke="#1c2740" stroke-width="2.4"/>
<line x1="100" y1="40" x2="1102" y2="40" stroke="#00e5ff" stroke-width="1.3" stroke-dasharray="10 14" opacity="0.9">
<animate attributeName="stroke-dashoffset" from="0" to="-240" dur="6s" repeatCount="indefinite"/></line>
<circle cx="100" cy="40" r="15" fill="#0b1520" stroke="#00e5ff" stroke-width="1.8"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="6.3s" begin="0.0s" repeatCount="indefinite"/></circle><text x="100" y="44" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#cfe8f0">E1</text><text x="100" y="72" text-anchor="middle" font-family="'Courier New',monospace" font-size="9.5" fill="#6f97a4">rays</text><circle cx="267" cy="40" r="15" fill="#0b1520" stroke="#00e5ff" stroke-width="1.8"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="6.3s" begin="0.9s" repeatCount="indefinite"/></circle><text x="267" y="44" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#cfe8f0">E2</text><text x="267" y="72" text-anchor="middle" font-family="'Courier New',monospace" font-size="9.5" fill="#6f97a4">lock-in</text><circle cx="434" cy="40" r="15" fill="#0b1520" stroke="#00e5ff" stroke-width="1.8"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="6.3s" begin="1.8s" repeatCount="indefinite"/></circle><text x="434" y="44" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#cfe8f0">E3</text><text x="434" y="72" text-anchor="middle" font-family="'Courier New',monospace" font-size="9.5" fill="#6f97a4">chirality</text><circle cx="601" cy="40" r="15" fill="#0b1520" stroke="#00e5ff" stroke-width="1.8"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="6.3s" begin="2.7s" repeatCount="indefinite"/></circle><text x="601" y="44" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#cfe8f0">E4</text><text x="601" y="72" text-anchor="middle" font-family="'Courier New',monospace" font-size="9.5" fill="#6f97a4">freq-inv</text><circle cx="768" cy="40" r="15" fill="#0b1520" stroke="#00e5ff" stroke-width="1.8"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="6.3s" begin="3.6s" repeatCount="indefinite"/></circle><text x="768" y="44" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#cfe8f0">E5</text><text x="768" y="72" text-anchor="middle" font-family="'Courier New',monospace" font-size="9.5" fill="#6f97a4">phase</text><circle cx="935" cy="40" r="15" fill="#0b1520" stroke="#00e5ff" stroke-width="1.8"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="6.3s" begin="4.5s" repeatCount="indefinite"/></circle><text x="935" y="44" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#cfe8f0">E6</text><text x="935" y="72" text-anchor="middle" font-family="'Courier New',monospace" font-size="9.5" fill="#6f97a4">eta-scan</text><circle cx="1102" cy="40" r="15" fill="#0b1520" stroke="#00e5ff" stroke-width="1.8"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="6.3s" begin="5.4s" repeatCount="indefinite"/></circle><text x="1102" y="44" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#cfe8f0">E7</text><text x="1102" y="72" text-anchor="middle" font-family="'Courier New',monospace" font-size="9.5" fill="#6f97a4">time-domain</text><circle r="3.6" fill="#e6ffff" filter="url(#glow)"><animateMotion dur="7.0s" begin="0s" repeatCount="indefinite" path="M100,40 L1102,40"/></circle>
</svg>
