<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="DOCS — MKDOCS MATERIAL SITE — animated banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0f2a"/>
      <stop offset="0.55" stop-color="#161b4a"/>
      <stop offset="1" stop-color="#0c0e26"/>
    </linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b9dff"/>
      <stop offset="0.5" stop-color="#f0f2ff"/>
      <stop offset="1" stop-color="#00c8e0"/>
      <animate attributeName="x1" values="-0.6;0.4" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.4;1.4" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b47b8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3b47b8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1a1f42" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="14" fill="url(#grid)" opacity="0.5"/>
  <rect width="1200" height="300" rx="14" fill="url(#halo)"/>
  <rect x="1.5" y="1.5" width="1197" height="297" rx="13" fill="none" stroke="#2a3060" stroke-width="1.4" opacity="0.8"/>

