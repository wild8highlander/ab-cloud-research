site_name: AB-Cloud Research
# docs/README.md is repo-facing meta-doc; keep it out of the site
# (it conflicts with index.md and breaks `mkdocs build --strict`).
exclude_docs: |
  README.md
site_description: >-
  AB-Cloud — a phase resonator for the zeros of the Riemann zeta function: monographs, 39-test
  Julia suite, 10-language verification, formal layer (Lean 4 · Coq · Agda · Isabelle), 3D lattice
  lab.
site_author: "Isaev Iskhak Khamzatovich"
site_url: "https://wild8highlander.github.io/ab-cloud-research"
# Build into dist-docs/ — site/ is the live Pxxl deploy portal, do not touch it.
site_dir: "dist-docs"
repo_url: "https://github.com/wild8highlander/ab-cloud-research"
repo_name: wild8highlander/ab-cloud-research
copyright: "Copyright © 2026 Isaev Iskhak Khamzatovich — Custom Research License"

theme:
  name: material
  # Brand system of the web portal: flat dark surfaces, cyan accent,
  # Manrope for text and Geist Mono for code (same fonts as the apps).
  font:
    text: Manrope
    code: Geist Mono
  palette:
    - scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js

nav:
  - Home: index.md
  - Getting started:
      - Quick start: quickstart.md
      - Julia suite (39 tests): julia-suite.md
  - Monographs:
      - Overview: monographs.md
      - Original v21 edition: monograph-v21.md
  - Verification:
      - 10-language suite: verification.md
      - Reference results: results.md
      - GOE/GUE audit v2.0.3: audit_v2.0.3.md
      - Rigidity-slope audit v2.0.4: audit_v2.0.4.md
  - Formal verification:
      - Lean 4 · Coq · Agda · Isabelle: formal.md
  - Repository:
      - Map: map.md
      - 3D laboratory: lab3d.md
  - About:
      - Citation: citation.md
      - License: license.md
      - FAQ: faq.md
