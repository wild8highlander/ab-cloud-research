name: First interaction

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    name: Greet first-time contributors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: >-
            👋 Welcome to AB-Cloud Research! Thanks for opening your first
            issue. Please make sure you filled in the issue template —
            component, version and reproduction steps help maintainers
            respond faster. See CONTRIBUTING.md for the house rules.
          pr-message: >-
            🎉 Thanks for your first pull request! A maintainer will review
            it shortly. Please double-check the PR checklist
            (.github/PULL_REQUEST_TEMPLATE.md): tests run locally,
            docs updated, CHANGELOG entry added. CI must be green before
            merge.
