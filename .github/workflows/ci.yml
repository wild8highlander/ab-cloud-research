name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure:
    name: Repository structure & metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check canonical artifacts exist
        run: |
          test -f code/ab_cloud_full.jl
          test -f code/julia/ab_cloud_full.jl
          test -f code/RH_Unified_D.jl
          test -f code/RH_Sweep_Pro_D.jl
          test -f code/hp_audit_standalone.jl
          test -f code/hp_audit_standal_one.jl
          test -f meridian-spectral-observatory/ab_cloud_full.jl
          test -f verification/python/ab_cloud_verify.py
          test -f formal/lean4/lakefile.lean
          test -f formal/coq/ABCloud/Core.v
          test -f formal/isabelle/ABCloud.thy
          test -f "results/Test 1-37 ab_cloud_full.jl/verification_run_v18_37tests_2026-08-28.txt"
          test -f "results/Test 1-37 ab_cloud_full.jl/ab_cloud_v19_verify_report_2026-09-02_23-33-45.txt"
          test -f monographs/ru/text/AB_Cloud_Monograph_v22_RU.pdf
          test -f monographs/en/text/AB_Cloud_Monograph_v22_EN.pdf
          test -f monographs/zh/text/AB_Cloud_Monograph_v22_ZH.pdf
          test -f monographs/original-v21/ru/text/AB_Cloud_Monograph_v21_RU_with_Verification.docx
          test -f monographs/original-v21/en/text/AB_Cloud_Monograph_v21_EN_with_Verification.pdf
          test -f CITATION.cff
          echo "All canonical artifacts present"
      - name: Validate CITATION.cff
        uses: citation-file-format/cffconvert-github-action@2.0.0
        with:
          args: --validate

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint the curated markdown surface
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          config: .markdownlint-cli2.jsonc
          globs: |
            *.md
            docs/**/*.md
            formal/**/*.md
            code/**/*.md
            verification/**/*.md
            Hilbert_Polya/*.md
            Hilbert_Polya/docs/*.md
            apps/*.md
            .github/*.md

  yaml:
    name: Workflow YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: yamllint (project config)
        run: pipx install yamllint && yamllint -c .yamllint.yaml .github/workflows/

  ruff:
    name: Python lint (ruff — real-defect gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.17"
      - name: Ruff check (ruff.toml + per-package configs)
        run: ruff check --output-format=github .

  pytest:
    name: Python tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install scientific stack + pytest
        run: |
          pip install --disable-pip-version-check \
            numpy scipy matplotlib mpmath sympy pytest
      - name: Run the unified test suite
        working-directory: AB_Cloud_Quantum_Research
        run: pytest tests/test_unified.py -q
      - name: Run the processor module tests
        working-directory: AB_Cloud_Quantum_Research
        run: pytest modules/processor_ab/tests/ -q
      - name: Run the core spectrum module tests
        working-directory: AB_Cloud_Quantum_Research
        run: pytest modules/core_spectrum/tests/ -q
      - name: Run the realtime spinor memory tests
        working-directory: AB_Cloud_Quantum_Research/research/realtime_spinor_memory
        run: pytest tests/ -q
