name: Stale

on:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-message: "This issue is stale: it has been open 60 days with no activity. Comment to keep it open."
          stale-pr-message: "This PR is stale: 60 days without activity. Comment or rebase to keep it open."
          exempt-issue-labels: "pinned,verification-data,roadmap"
