name: Formal verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Four independent proof assistants compile the formal/ tree:
#   lean4    — lake build + the executable re-verification program
#   coq      — coq_makefile build (apt Coq on the runner)
#   agda     — agda --include-path type-check (apt Agda, builtins only)
#   isabelle — official Isabelle docker image, isabelle build session
# Every job is fully independent: a failure in one assistant does not
# mask or block the others.

jobs:
  lean4:
    name: Lean4 — lake build + verified re-computation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The Lean package lives in formal/lean4, not at the repository root:
      # lean-action resolves the toolchain, lake-manifest.json and the .lake
      # cache relative to lake-package-directory, so it must be pointed at
      # the package explicitly (defaults to "." and would fail otherwise).
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/lean4
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: true
      - name: Build the ABCloud Lean library
        working-directory: formal/lean4
        run: lake build
      - name: Run abcloud-verify (recompute the frozen reference numbers)
        working-directory: formal/lean4
        run: lake exe abcloud-verify

  coq:
    name: Coq — coqc compile + machine checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Coq
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends coq
        shell: bash
      - name: Compile the ABCloud Coq development
        working-directory: formal/coq
        run: |
          coq_makefile -f _CoqProject -o Makefile.coq
          make -f Makefile.coq -j2
      - name: Print the certified headline computations
        working-directory: formal/coq
        run: |
          echo 'Require Import ABCloud.Core.
          Compute b_toy.
          Compute psl27_order.
          Compute psl28_order.
          Compute psl213_order.' | coqtop -Q ABCloud ABCloud
      - name: Fail if any Coq computation errored
        working-directory: formal/coq
        run: |
          echo 'Require Import ABCloud.Core.
          Compute b_toy.
          Compute psl27_order.
          Compute psl28_order.
          Compute psl213_order.' | coqtop -Q ABCloud ABCloud 2>&1 | tee /tmp/coq_out.txt
          if grep -q "Error" /tmp/coq_out.txt; then
            echo "::error::coqtop reported an error while computing the headline certificates"
            exit 1
          fi

  agda:
    name: Agda — type-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Agda
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends agda
        shell: bash
      - name: Type-check the ABCloud Agda module (stdlib-free, builtins only)
        working-directory: formal/agda
        run: agda -i . -i . ABCloud.agda

  isabelle:
    name: Isabelle/HOL — build session
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: makarius/isabelle:Isabelle2025
      # If the tag above is unavailable at some point, switch to the
      # previous stable release image, e.g. makarius/isabelle:Isabelle2024.
      # The image defaults to USER isabelle (uid 1000), which cannot write
      # into the runner-owned checkout; run as root instead. The isabelle
      # binary is also not on the image PATH, hence the absolute invocation.
      options: --user root
    steps:
      - uses: actions/checkout@v7
      - name: Build the ABCloud Isabelle session
        run: /home/isabelle/Isabelle/bin/isabelle build -v -D formal/isabelle
