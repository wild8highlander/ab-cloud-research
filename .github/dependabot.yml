version: 2
updates:
  # ── GitHub Actions ─────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minor:
        update-types: [minor, patch]

  # ── Python (pip) ───────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/lab-3d"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      pip-minor:
        update-types: [minor, patch]

  - package-ecosystem: "pip"
    directory: "/projects/quantum-research/modules/core_spectrum"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      pip-minor:
        update-types: [minor, patch]

  - package-ecosystem: "pip"
    directory: "/projects/quantum-research/modules/processor_ab"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
