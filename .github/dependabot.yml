    open-pull-requests-limit: 2

  - package-ecosystem: "gomod"
    directory: "/projects/academic-package/06_code/go"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2

  # ── Rust ───────────────────────────────────────────────────────
  - package-ecosystem: "cargo"
    directory: "/verification/rust"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2

  - package-ecosystem: "cargo"
    directory: "/verification/rust/spinor38"
