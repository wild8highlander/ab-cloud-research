# PR auto-labeling by changed paths
"julia-suite":
  - changed-files:
    - any-glob-to-any-file: "code/**"
"verification":
  - changed-files:
    - any-glob-to-any-file: "verification/**"
"3d-lab":
  - changed-files:
    - any-glob-to-any-file: "lab-3d/**"
"monographs":
  - changed-files:
    - any-glob-to-any-file: "monographs/**"
"documentation":
  - changed-files:
    - any-glob-to-any-file: "docs/**"
    - any-glob-to-any-file: "*.md"
"ci":
  - changed-files:
    - any-glob-to-any-file: ".github/**"
