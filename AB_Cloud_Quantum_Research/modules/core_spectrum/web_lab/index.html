<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AB Research Program · Web Lab</title>
<style>
:root { --bg:#10101A; --panel:#181826; --ink:#E8E4DA; --line:#4FB3BE;
        --copper:#E08B66; --muted:#9A938A; --grid:#2A2A3A; --ok:#6FBF8A; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink);
       font-family:'Segoe UI', system-ui, sans-serif; }
header { padding:18px 24px 8px; }
h1 { font-size:20px; margin:0 0 2px; }
h1 .cop { color:var(--copper); }
.sub { color:var(--muted); font-size:12.5px; }
.lang { float:right; }
.lang button { background:var(--panel); color:var(--ink);
  border:1px solid var(--grid); border-radius:6px; padding:4px 12px;
  cursor:pointer; margin-left:6px; }
.lang button.on { border-color:var(--copper); color:var(--copper); }
nav { display:flex; gap:4px; padding:10px 24px; flex-wrap:wrap; }
nav button { background:var(--panel); color:var(--ink);
  border:1px solid var(--grid); border-radius:8px 8px 0 0;
  padding:8px 16px; cursor:pointer; font-size:13px; }
nav button.on { background:var(--line); color:#0b1517; font-weight:600;
  border-color:var(--line); }
main { margin:0 24px 24px; background:var(--panel); border:1px solid
  var(--grid); border-radius:0 10px 10px 10px; padding:18px; }
canvas { width:100%; height:380px; display:block; background:var(--bg);
  border:1px solid var(--grid); border-radius:8px; }
.controls { display:flex; gap:18px; flex-wrap:wrap; margin:12px 0; }
.ctl { font-size:12.5px; color:var(--muted); }
.ctl input[type=range] { width:150px; vertical-align:middle; }
.ctl b { color:var(--ink); }
.readout { font-size:13px; color:var(--ink); margin-top:8px; line-height:1.7; }
.readout .cop { color:var(--copper); }
.note { color:var(--muted); font-size:11.5px; margin-top:10px;
  line-height:1.55; }
.tab { display:none; } .tab.on { display:block; }
.thm-card { border:1px solid var(--grid); border-radius:8px;
  padding:12px 14px; margin:10px 0; background:var(--bg); }
.thm-card .thm-t { color:var(--copper); font-weight:600; font-size:13.5px; }
.thm-card .thm-s { font-size:12.5px; margin:6px 0; line-height:1.6; }
.thm-card .thm-c { font-size:11.5px; color:var(--muted); line-height:1.55; }
.thm-card .thm-f { font-size:11.5px; color:#6FBF8A; margin-top:4px; }
table.kv2 { width:100%; border-collapse:collapse; font-size:12px; margin-top:8px; }
table.kv2 td, table.kv2 th { border:1px solid var(--grid); padding:5px 8px; text-align:left; }
table.kv2 th { color:var(--copper); font-weight:600; }
</style>
</head>
<body>
<header>
  <div class="lang">
    <button id="btn_ru" class="on" onclick="setLang('ru')">RU</button>
    <button id="btn_en" onclick="setLang('en')">EN</button>
  </div>
  <h1>AB RESEARCH PROGRAM <span class="cop">· WEB LAB</span> v1.0.0</h1>
  <div class="sub" id="subtitle"></div>
</header>
<nav>
  <button id="nav0" class="on" onclick="show(0)">Z(t) Римана–Зигеля</button>
  <button id="nav1" onclick="show(1)">Конструктор затворов</button>
  <button id="nav2" onclick="show(2)">Тепловой след ↔ простые</button>
  <button id="nav3" onclick="show(3)">Критерий Ли</button>
  <button id="nav4" onclick="show(4)">ψ-лестница</button>
  <button id="nav5" onclick="show(5)">Полный гамильтониан</button>
  <button id="nav6" onclick="show(6)">Электрон на Re(s)=½</button>
  <button id="nav7" onclick="show(7)">AB-Pong · оператор-процессор</button>
  <button id="nav8" onclick="show(8)">Сшивка ветвей (V19)</button>
  <button id="nav9" onclick="show(9)">Теоремы (Th1–Th6)</button>
</nav>
<main>
<section class="tab on" id="tab0">
  <canvas id="cv0" width="1200" height="380"></canvas>

    <div class="ctl"><span class="l" data="tmax">T max</span>:
      <input type="range" id="tmax" min="50" max="600" value="200"

  <div class="readout" id="ro0"></div>
  <div class="note l" data="note0"></div>
</section>
<section class="tab" id="tab1">
  <canvas id="cv1" width="1200" height="380"></canvas>

      value="4" oninput="drawGate()"><b id="gNvv">4</b></div>

      value="5" oninput="drawGate()"><b id="gWv">0.5</b></div>

  </div>
  <div class="readout" id="ro1"></div>
  <div class="note l" data="note1"></div>
</section>
<section class="tab" id="tab2">
  <canvas id="cv2" width="1200" height="380"></canvas>
  <div class="readout" id="ro2"></div>

</section>
<section class="tab" id="tab3">
  <canvas id="cv3" width="1200" height="380"></canvas>
  <div class="readout" id="ro3"></div>

</section>
<section class="tab" id="tab4">
  <canvas id="cv4" width="1200" height="380"></canvas>
  <div class="readout" id="ro4"></div>
  <div class="note l" data="note4"></div>
</section>
<section class="tab" id="tab5">
  <canvas id="cv5" width="1200" height="380"></canvas>

    <div class="ctl"><span class="l" data="hmet">Метрика</span>:
      <select id="hmetric" onchange="drawFullHam()">

  </div>

</section>
<section class="tab" id="tab6">
  <canvas id="cv6" width="1200" height="380"></canvas>

    <button onclick="drawElectron()"

      padding:6px 14px;cursor:pointer;font-weight:600">⟲</button>
  </div>
  <div class="readout" id="ro6"></div>
  <div class="note l" data="note6"></div>
</section>
<section class="tab" id="tab7">
  <canvas id="cv7" width="1200" height="380"></canvas>

</section>

// ── Риман–Зигель ─────────────────────────────────────────────────────
function theta(t) { // Римана–Зигеля θ(t) — Стирлинг, главная ветвь
  // (Ланцош-лог не гарантирует главную ветвь Im; асимптотика даёт
  //  O(t^-9) ≈ 1e-11 при t ≥ 14 — избыточно для всех вкладок)
  const p = Math.PI;
  return t/2*Math.log(t/(2*p)) - t/2 - p/8 + 1/(48*t)
    + 7/(5760*t*t*t) + 31/(8064*Math.pow(t,5))
    + 127/(30720*Math.pow(t,7));
}
class Complex {
  constructor(re, im=0){ this.re=re; this.im=im; }
  add(o){ return new Complex(this.re+o.re, this.im+o.im); }
  mul(o){ return new Complex(this.re*o.re-this.im*o.im,
    this.re*o.im+this.im*o.re); }
  div(o){ const d=o.re*o.re+o.im*o.im;
    return new Complex((this.re*o.re+this.im*o.im)/d,
      (this.im*o.re-this.re*o.im)/d); }
  exp(){ return new Complex(Math.exp(this.re)*Math.cos(this.im),
    Math.exp(this.re)*Math.sin(this.im)); }
  conj(){ return new Complex(this.re, -this.im); }
}
function zetaHalf(t, N=60) { // ζ(1/2+it) рядом Диригле с окном
  let s = new Complex(0, 0);
  for (let n = 1; n <= N; n++) {
    const w = Math.exp(-Math.pow(n/N, 2)*6); // мягкое окно
    s = s.add(new Complex(Math.cos(-t*Math.log(n)),
      Math.sin(-t*Math.log(n))).mul(new Complex(Math.pow(n,-0.5)*w,0)));
  }
  return s;
}
function drawZ() {
  const Tm = +document.getElementById('tmax').value;
  document.getElementById('tmaxv').textContent = Tm;
  const cv = document.getElementById('cv0'), cx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  cx.clearRect(0,0,W,H);
  const th0 = thetaSmall(0);
  let zmin = 1e9, zmax = -1e9;
  const pts = [];
  for (let px = 0; px <= W; px++) {
    const t = Tm*px/W;
    const z = hardyZ(t);
    pts.push([px, z]);
    zmin = Math.min(zmin, z); zmax = Math.max(zmax, z);
  }
  const pad = 10;
  const y0 = v => H-pad-(v-zmin)/(zmax-zmin+1e-9)*(H-2*pad);
  cx.strokeStyle = '#4FB3BE'; cx.lineWidth = 1.6; cx.beginPath();
  for (const [px, z] of pts) px===0 ? cx.moveTo(px, y0(z))
    : cx.lineTo(px, y0(z));
  cx.stroke();
  cx.strokeStyle = '#2A2A3A'; cx.beginPath(); cx.moveTo(0,y0(0));
  cx.lineTo(W,y0(0)); cx.stroke();
  cx.fillStyle = '#E08B66';
  for (const g of ZEROS) { if (g > Tm) break;
    const px = g/Tm*W; cx.beginPath(); cx.arc(px, y0(0), 4, 0, 7);
    cx.fill(); }
  document.getElementById('ro0').innerHTML =
    (LANG==='ru' ? 'Нулей в окне: ' : 'Zeros in window: ')
    + ZEROS.filter(g=>g<=Tm).length
    + ' · Z(0) = ' + hardyZ(0).toFixed(4)
    + ' · θ(0)/π = ' + (thetaSmall(0)/Math.PI).toFixed(4);
}
function thetaSmall(t) { // θ(t) через асимптотику (быстро, для графики)
  const p = Math.PI;
  return t/2*Math.log(t/(2*p)) - t/2 - p/8 + 1/(48*t);
}
function hardyZ(t) { // Z = 2 Σ n^{-1/2} cos(θ − t ln n) с окном
  const th = thetaSmall(t);
  let s = 0; const N = Math.max(30, Math.floor(Math.sqrt(t)*8));
  for (let n = 1; n <= N; n++) {
    const w = Math.exp(-Math.pow(n/N,2)*5);
    s += w/Math.sqrt(n)*Math.cos(th - t*Math.log(n));
  }
  return 2*s;
}

// ── Конструктор затворов ─────────────────────────────────────────────
function buildH(L, Nv, q, W) {
  const N = L*L;
  const H = [];
  for (let i = 0; i < N; i++) {
    const row = [];
    for (let j = 0; j < N; j++) row.push(new Complex(0, 0));
    H.push(row);
  }
  const rng = mulberry(96);
  const vx = [], vy = [], vq = [];
  for (let k = 0; k < Nv; k++) {
    vx.push(1+Math.floor(rng()*(L-1))+0.5);
    vy.push(1+Math.floor(rng()*(L-1))+0.5);
    vq.push(k < Nv/2 ? q : -q);
  }
  const idx = (x,y) => y*L + x;
  for (let y = 0; y < L; y++)
    for (let x = 0; x < L-1; x++) {
      const ph = 2*Math.PI*0.5*y;
      const v = exp1j(ph);
      H[idx(x,y)][idx(x+1,y)] = v;
      H[idx(x+1,y)][idx(x,y)] = new Complex(v.re, -v.im);
    }
  for (let y = 0; y < L-1; y++)
    for (let x = 0; x < L; x++) {
      let ph = 0;
      for (let k = 0; k < Nv; k++) {
        const a1 = Math.atan2(y-vy[k], x-vx[k]);
        const a2 = Math.atan2(y+1-vy[k], x-vx[k]);
        ph += 0.5*vq[k]*(a2-a1);
      }
      const v = exp1j(ph);
      H[idx(x,y)][idx(x,y+1)] = v;
      H[idx(x,y+1)][idx(x,y)] = new Complex(v.re, -v.im);
    }
  for (let y = 0; y < L; y++)
    for (let x = 0; x < L; x++) {
      let d = 0;
      for (let k = 0; k < Nv; k++) {
        const r2 = (x+1-vx[k])**2 + (y+1-vy[k])**2;
        d += vq[k]*W/(r2/N + 1);

// Якоби для эрмитовой матрицы (объекты Complex)
function jacobiEig(Hin, sweeps=12) {
  const n = Hin.length;
  const A = [];
  for (let i = 0; i < n; i++) { A.push(new Array(n));
    for (let j = 0; j < n; j++) A[i][j] = new Complex(Hin[i][j].re,
      Hin[i][j].im); }
  for (let sw = 0; sw < sweeps; sw++) {
    let off = 0;
    for (let i = 0; i < n-1; i++) for (let j = i+1; j < n; j++)
      off += A[i][j].re*A[i][j].re + A[i][j].im*A[i][j].im;
    if (off < 1e-22) break;
    for (let p = 0; p < n-1; p++) for (let q = p+1; q < n; q++) {
      const m = A[p][q].re*A[p][q].re + A[p][q].im*A[p][q].im;
      if (m < 1e-28) continue;
      const absa = Math.sqrt(m);
      const a = A[p][q];
      const delta = A[q][q].re - A[p][p].re;
      const th = delta/(2*absa);
      const t = Math.sign(th || 1)/(Math.abs(th) + Math.sqrt(th*th+1));
      const c = 1/Math.sqrt(t*t+1);
      const ph = Math.atan2(a.im, a.re);
      const s = new Complex(t*c*Math.cos(ph), t*c*Math.sin(ph));
      const sb = new Complex(s.re, -s.im);
      for (let k = 0; k < n; k++) {
        const apk = A[p][k], aqk = A[q][k];
        A[p][k] = new Complex(c*apk.re - s.re*aqk.re + s.im*aqk.im,
          c*apk.im - s.re*aqk.im - s.im*aqk.re);
        A[q][k] = new Complex(sb.re*apk.re - sb.im*apk.im + c*aqk.re,
          sb.re*apk.im + sb.im*apk.re + c*aqk.im);
      }
      for (let k = 0; k < n; k++) {
        const akp = A[k][p], akq = A[k][q];
        A[k][p] = new Complex(c*akp.re - sb.re*akq.re + sb.im*akq.im,
          c*akp.im - sb.re*akq.im - sb.im*akq.re);
        A[k][q] = new Complex(s.re*akp.re - s.im*akp.im + c*akq.re,
          s.re*akp.im + s.im*akp.re + c*akq.im);
      }
      A[p][p] = new Complex(A[p][p].re, 0);
      A[q][q] = new Complex(A[q][q].re, 0);
      A[p][q] = new Complex(0, 0);
      A[q][p] = new Complex(0, 0);

  for (let i = 0; i < n; i++) ev.push(A[i][i].re);

}

  const r = meanR(u);

  const w = cv.width, h = cv.height;

  for (let b = 0; b < bins; b++) {

    const s = lo + (hi-lo)*px/w;
    const p = 32/Math.PI/Math.PI*s*s*Math.exp(-4*s*s/Math.PI)*u.length*(hi-lo)/bins;
    const py = h-30 - p/mx*(h-60);
    px===0 ? cx.moveTo(px,py) : cx.lineTo(px,py);

    'N = ' + (L*L) + ' · ⟨r⟩ = <span class="cop">' + r.toFixed(4)
    + '</span> · GUE 0.5992 · '
    + (LANG==='ru' ? 'уровней в окне: ' : 'levels in window: ') + u.length;
}
function unfold(vals) {
  const n = vals.length;
  const idx = [...Array(n).keys()];
  // монотонная кусочно-линейная развёртка по рангам
  const sorted = [...vals].map((v,i)=>[v,i]).sort((a,b)=>a[0]-b[0]);
  const u = new Array(n);
  const knots = 8;
  for (let k = 0; k < knots; k++) {
    const a = Math.floor(k*n/knots), b = Math.min(n-1,
      Math.floor((k+1)*n/knots));
    for (let i = a; i <= b; i++) u[sorted[i][1]] = i;
  }
  return u;
}
function meanR(u) {
  let acc = 0, cnt = 0;
  for (let i = 0; i < u.length-2; i++) {
    const s1 = u[i+1]-u[i], s2 = u[i+2]-u[i+1];
    if (s1 > 0 && s2 > 0) { acc += Math.min(s1,s2)/Math.max(s1,s2); cnt++; }
  }
  return cnt ? acc/cnt : 0;
}

function drawTrace() {
  const cv = document.getElementById('cv2'), cx = cv.getContext('2d');
  const w = cv.width, h = cv.height;
  cx.clearRect(0,0,w,h);
  const xs = [], K = [], P = [];
  for (let i = 0; i <= 60; i++) {
    const x = 0.05 + 1.2*i/60;
    let k = 0;
    for (const g of ZEROS) { if (g > 3000) break; k += Math.exp(-x*g); }
    let p = 0;
    for (const [n, l] of CARR) {
      const ln = Math.log(n);
      p += l/Math.sqrt(n)*x/(x*x+ln*ln);
    }
    xs.push(x); K.push(k); P.push(p);
  }
  const kmax = Math.max(...K), pmax = Math.max(...P);
  // K на левую ось, P на правую (нормировка к общей высоте)
  cx.strokeStyle = '#4FB3BE'; cx.lineWidth = 2; cx.beginPath();
  xs.forEach((x,i)=>{ const px = x/1.25*w, py = h-30-K[i]/kmax*(h-70);
    i===0?cx.moveTo(px,py):cx.lineTo(px,py); });
  cx.stroke();
  cx.strokeStyle = '#E08B66'; cx.beginPath();
  xs.forEach((x,i)=>{ const px = x/1.25*w, py = h-30-P[i]/pmax*(h-70);
    i===0?cx.moveTo(px,py):cx.lineTo(px,py); });
  cx.stroke();
  cx.fillStyle = '#9A938A'; cx.font = '12px sans-serif';
  cx.fillText('K(x) = Σ e^(−xγ)', 14, 24);
  cx.fillStyle = '#E08B66';
  cx.fillText('P(u) = Σ Λ(n)/√n·u/(u²+ln²n)', 220, 24);
  document.getElementById('ro2').innerHTML =
    (LANG==='ru' ? 'Обе кривые убывают согласованно — вес простых живёт '
      + 'в тепловом следе нулей (V7, PC0 r = +0.9996).'
      : 'Both curves decay consistently — the prime weight lives in the '
      + 'heat trace of the zeros (V7, PC0 r = +0.9996).');
}

// ── V18: AB-Pong — оператор как процессор ────────────────────────────
function mulberry32(a) { return function() { a |= 0; a = a + 0x6D2B79F5
  | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^
  t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const PONG = { run:false, score:[0,0], ly:170, ry:170, bx:600, by:190,
  vx:5.2, vy:2.6, rng:mulberry32(96), gate:'I', gf:0, kicks:0,
  phase:0, amp:1 };
const GATES = ['X','Y','Z','H','S','T'];
function opDecide(ballY) { // решение оператора: измерение 2-кубита
  PONG.gf++;
  if (PONG.gf % 26 === 0) { // такт оператора: свежие ворота + фаза
    PONG.gate = GATES[Math.floor(PONG.rng()*6)];
    PONG.phase = PONG.rng()*Math.PI/2;
    PONG.amp = 0.55 + 0.45*Math.abs(Math.sin(PONG.phase));
  }
  const wob = PONG.amp*46*Math.sin(ballY*0.045 + PONG.phase*3);
  const target = ballY + wob - 40;
  const d = target - PONG.ry;
  return Math.max(-6.4, Math.min(6.4, d*0.16));
}
function pongStart() {
  if (PONG.run) return;
  PONG.run = true;
  PONG.rng = mulberry32(96); // сид V18 — реплей бит-в-бит
  Object.assign(PONG, {score:[0,0], bx:600, by:190, vx:5.2, vy:2.6,
    kicks:0, gf:0, gate:'I', phase:0, amp:1});
  pongLoop();
}
function pongLoop() {
  if (!PONG.run) return;
  const cv = document.getElementById('cv7'), cx = cv.getContext('2d');
  const w = cv.width, h = cv.height;
  PONG.bx += PONG.vx; PONG.by += PONG.vy;
  if (PONG.by < 12 || PONG.by > h-16) { PONG.vy = -PONG.vy;
    PONG.by = Math.max(12, Math.min(h-16, PONG.by)); }
  PONG.ry += opDecide(PONG.by);
  PONG.ry = Math.max(8, Math.min(h-88, PONG.ry));
  if (PONG.bx < 34 && PONG.bx > 22 && Math.abs(PONG.by-20-PONG.ly) < 48) {
    PONG.vx = Math.abs(PONG.vx)*1.045; PONG.vy += (PONG.by-20-PONG.ly)*0.03;
    PONG.kicks++; }
  if (PONG.bx > w-36 && PONG.bx < w-24
      && Math.abs(PONG.by-20-PONG.ry) < 48) {
    PONG.vx = -Math.abs(PONG.vx)*1.045;
    PONG.vy += (PONG.by-20-PONG.ry)*0.03; PONG.kicks++; }
  if (PONG.bx < -12) { PONG.score[1]++; pongReset(); }
  if (PONG.bx > w+12) { PONG.score[0]++; pongReset(); }
  // отрисовка
  cx.clearRect(0,0,w,h);
  cx.strokeStyle = '#2A2A3A'; cx.setLineDash([8,10]);
  cx.beginPath(); cx.moveTo(w/2,0); cx.lineTo(w/2,h); cx.stroke();
  cx.setLineDash([]);
  cx.fillStyle = '#4FB3BE';
  cx.fillRect(22, PONG.ly, 12, 80);
  cx.fillStyle = '#E08B66';
  cx.fillRect(w-34, PONG.ry, 12, 80);
  cx.fillStyle = '#E8E4DA';
  cx.beginPath(); cx.arc(PONG.bx, PONG.by, 7, 0, 7); cx.fill();
  cx.font = '28px sans-serif'; cx.fillStyle = '#9A938A';
  cx.fillText(PONG.score[0], w/2-60, 40);
  cx.fillText(PONG.score[1], w/2+44, 40);
  cx.font = '12px sans-serif';
  cx.fillText((LANG==='ru'?'оператор: ворота ':'operator: gate ')
    + PONG.gate, w-190, 24);
  const ru = LANG==='ru';
  document.getElementById('ro7').innerHTML =
    (ru?'ударов':'kicks')+': '+PONG.kicks+' · '+
    (ru?'эталон V18':'reference V18')+': 0:1, 10 '+(ru?'ударов':'kicks')+
    ', '+(ru?'реплей бит-в-бит':'bit-exact replay')+' · '+
    (ru?'ворота':'gates')+' {X,Y,Z,H,S,T} '+(ru?'точные':'exact')+
    ' (1−2e-16) · C = 0.984';
  requestAnimationFrame(pongLoop);
}
function pongReset() {
  PONG.bx = 600; PONG.by = 190;
  PONG.vx = (PONG.vx>0?-1:1)*5.2; PONG.vy = 2.6;
  PONG.gf = 0; PONG.gate = 'I';
}

function drawStitch() {
  const cv = document.getElementById('cv8'), cx = cv.getContext('2d');
  const w = cv.width, h = cv.height;
  cx.clearRect(0,0,w,h);
  const mid = [];
  for (let k = 0; k < ZEROS.length - 1; k++)
    mid.push(0.5*(ZEROS[k] + ZEROS[k+1]));
  const th = mid.map(t => theta(t));
  // (a) θ-лестница
  const wA = Math.floor(w*0.38);
  const bins = new Array(40).fill(0);
  for (let k = 0; k < th.length - 1; k++) {
    const f = ((th[k+1]-th[k])/Math.PI) % 2; const u = (f+2)%2;
    bins[Math.min(39, Math.floor(u/2*40))]++;
  }
  const mx = Math.max(...bins);
  cx.fillStyle = '#0E7C86';
  for (let i = 0; i < 40; i++) {
    const bw = wA/40 - 1, bh = bins[i]/mx*(h-70);
    cx.fillRect(i*wA/40+1, h-30-bh, bw, bh);
  }
  const piX = 0.5/2*wA;
  cx.strokeStyle = '#C96F4A'; cx.lineWidth = 1.6; cx.setLineDash([6,4]);
  cx.beginPath(); cx.moveTo(piX, 20); cx.lineTo(piX, h-30); cx.stroke();
  cx.setLineDash([]);
  let conc = 0;
  for (let k = 0; k < th.length - 1; k++) {
    const f = ((th[k+1]-th[k])/Math.PI) % 2; const u = (f+2)%2;
    if (Math.abs(u-1) < 0.3) conc++;
  }
  conc /= (th.length - 1);
  cx.fillStyle = '#1A1A24'; cx.font = '13px sans-serif';
  cx.fillText('Δθ mod 2π → π: ' + conc.toFixed(3), 10, 16);
  // (b) знаковая когерентность
  const xB = wA, wB = Math.floor(w*0.34);
  let agree = 0; const cum = [];
  for (let k = 0; k < mid.length; k++) {
    if (Math.sign(Math.cos(th[k])) === Math.pow(-1, k)) agree++;
    cum.push(agree/(k+1));
  }
  cx.strokeStyle = '#0E7C86'; cx.lineWidth = 1.5; cx.beginPath();
  for (let k = 0; k < cum.length; k++) {
    const px = xB + k/cum.length*wB, py = h-30 - (cum[k]-0.9)/0.1*(h-60);
    k ? cx.lineTo(px,py) : cx.moveTo(px,py);
  }
  cx.stroke();
  cx.strokeStyle = '#DDD6C8'; cx.setLineDash([4,4]); cx.beginPath();
  const y1 = h-30 - (1.0-0.9)/0.1*(h-60);
  cx.moveTo(xB, y1); cx.lineTo(xB+wB, y1); cx.stroke(); cx.setLineDash([]);
  cx.fillStyle = '#1A1A24';
  cx.fillText('sign(cos θ) = (−1)^k: ' + (agree/mid.length).toFixed(4)
    + ' (' + (mid.length-agree) + ' сбоев)', xB+10, 16);
  // (c) фазовый тор ζ^{ra+sb}, N=15
  const N = 15, xC = xB + wB + 12, wC = w - xC - 8;
  const cell = Math.min(wC/N, (h-60)/N);
  const a = 7, b = 3;
  for (let r = 0; r < N; r++) for (let s = 0; s < N; s++) {
    const ph = 2*Math.PI*(a*r+b*s)/N;
    const re = Math.cos(ph), g2 = Math.sin(ph);
    const rr = Math.round(128 + 127*re), gg = Math.round(128 + 127*g2);
    cx.fillStyle = 'rgb(' + rr + ',' + gg + ',160)';
    cx.fillRect(xC + s*cell, h-30-(r+1)*cell, cell-1, cell-1);
  }
  cx.fillStyle = '#1A1A24';
  cx.fillText('ζ^{ra+sb} на торе (Z/15)²', xC, 16);
  const ro = document.getElementById('ro8');
  if (ro) ro.innerHTML = '<span>V19 · сшивка ветвей: концентрация '
    + conc.toFixed(3) + ' · когерентность '
    + (agree/mid.length).toFixed(4) + ' · N² = 225 листов · '
    + 'вердикт: ALGEBRAIC_CERTIFICATE</span>';
}
