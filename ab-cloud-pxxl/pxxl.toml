# ──────────────────────────────────────────────────────────────
# pxxl.toml — Pxxl configuration for ab-cloud-research
# Docs: https://docs.pxxl.app/routing-and-rewrites
#
# The portal is a PURE STATIC multi-page site:
#   /            → portal landing        (dist/index.html)
#   /dashboard/  → React dashboard       (dist/dashboard/)
#   /lab3d/      → Three.js laboratory   (dist/lab3d/)
#
# Deployment target: Static App (files only — no runtime container,
# no start command, no port, no health check). Per the Pxxl docs a
# non-static start command would flip the build plan to a Web
# Service, so none is declared here. scripts/serve.mjs stays in the
# repository as a platform-agnostic fallback for other hosts.
# ──────────────────────────────────────────────────────────────

version = 1

[build]
command = "npm run build"
output  = "dist"

# ── canonical redirects ──────────────────────────────────────
# The two Vite apps are mounted at directory prefixes and ship
# RELATIVE asset URLs (vite `base: './'`). They must therefore be
# opened with a trailing slash — otherwise the browser resolves
# "./assets/…" against the site root and the page renders blank.
# These 308s make both URL forms work everywhere (old bookmarks,
# bare /dashboard mentions in docs and chats).
[[redirects]]
source      = "/dashboard"
destination = "/dashboard/"
status      = 308

[[redirects]]
source      = "/lab3d"
destination = "/lab3d/"
status      = 308

# Canonical root form.
[[redirects]]
source      = "/index.html"
destination = "/"
status      = 308

# No [routing] spa fallback: the portal is a classic multi-page
# site with a real file at every URL. A SPA fallback would serve
# the landing page for every broken link and mask genuine 404s.

# ── cache + security headers ─────────────────────────────────
# Vite emits content-hashed filenames under /dashboard/assets and
# /lab3d/assets, so those are safe to cache forever.
[[headers]]
source = "/dashboard/assets/:path*"
[headers.headers]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
source = "/lab3d/assets/:path*"
[headers.headers]
Cache-Control = "public, max-age=31536000, immutable"

# Site-wide hardening and sane defaults for HTML responses.
[[headers]]
source = "/:path*"
[headers.headers]
X-Content-Type-Options = "nosniff"
Referrer-Policy        = "strict-origin-when-cross-origin"
X-Frame-Options        = "SAMEORIGIN"
Permissions-Policy     = "camera=(), microphone=(), geolocation=()"
