<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Off the Critical Line · AB-Cloud Research</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#05060f" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305060f'/%3E%3Ctext x='32' y='46' font-size='42' text-anchor='middle' fill='%234fc3f7' font-family='Georgia,serif' font-style='italic'%3E%CE%B6%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #05060f;
      --panel: rgba(255, 255, 255, 0.025);
      --line: rgba(79, 195, 247, 0.18);
      --accent: #4fc3f7;
      --accent-2: #8be9fd;
      --text: #e8eef7;
      --muted: #8a94ab;
      --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      overflow-x: hidden; position: relative; text-align: center; padding: 24px;
    }
    .bg-grid {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(79,195,247,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(79,195,247,0.05) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black 30%, transparent 75%);
    }
    .bg-glow {
      position: fixed; z-index: 0; pointer-events: none;
      width: 900px; height: 480px; left: 50%; top: -220px; transform: translateX(-50%);
      background: radial-gradient(ellipse at center, rgba(79,195,247,0.14), transparent 65%);
      filter: blur(10px);
    }
    .bg-zeta {
      position: fixed; right: -40px; bottom: -140px; z-index: 0; pointer-events: none;
      font-family: Georgia, serif; font-style: italic;
      font-size: clamp(320px, 50vw, 640px); line-height: 1;
      color: rgba(79, 195, 247, 0.045); user-select: none;
    }
    .wrap { position: relative; z-index: 1; max-width: 640px; }
    .code {
      font-family: var(--mono); font-size: clamp(84px, 18vw, 150px); font-weight: 800;
      line-height: 1; letter-spacing: -0.04em;
      background: linear-gradient(92deg, #4fc3f7 0%, #8be9fd 45%, #ffffff 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .badge {
      display: inline-block; font-family: var(--mono); font-size: 12px;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent-2);
      border: 1px solid var(--line); border-radius: 999px;
      padding: 7px 16px; background: var(--panel); backdrop-filter: blur(4px);
      margin-bottom: 22px;
    }
    h1 { font-size: clamp(20px, 4vw, 28px); font-weight: 700; margin: 18px 0 12px; letter-spacing: -0.01em; }
    p { color: var(--muted); font-size: 15px; line-height: 1.7; max-width: 520px; margin: 0 auto; }
    p b { color: var(--text); font-weight: 600; }
    nav {
      margin-top: 34px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;
      font-family: var(--mono); font-size: 14px;
    }
    nav a {
      color: var(--accent); text-decoration: none;
      border: 1px solid var(--line); border-radius: 12px;
      padding: 11px 20px; background: var(--panel);
      transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }
    nav a:hover {
      border-color: rgba(79,195,247,0.45); transform: translateY(-2px);
      box-shadow: 0 12px 30px -14px rgba(79,195,247,0.4);
    }
    ::selection { background: rgba(79,195,247,0.35); }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>
  <div class="bg-zeta">ζ</div>

  <main class="wrap">
    <span class="badge">HTTP 404 · zero not found</span>
    <div class="code">404</div>
    <h1>This zero is off the critical line.</h1>
    <p>
      The page you asked for does not exist — it never landed on
      <b>Re(s)&nbsp;=&nbsp;½</b>. Every real destination is one click away:
    </p>
    <nav>
      <a href="/">portal&nbsp;home</a>
      <a href="/dashboard/">verification&nbsp;dashboard</a>
      <a href="/lab3d/">3D&nbsp;laboratory</a>
    </nav>
  </main>
</body>
</html>
