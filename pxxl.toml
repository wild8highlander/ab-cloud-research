# ════════════════════════════════════════════════════════════════
# pxxl.toml — bulletproof Pxxl deployment for ab-cloud-research
#
# Docs:
#   https://docs.pxxl.app/routing-and-rewrites      (this file's schema)
#   https://docs.pxxl.app/deploy/configuration      (build settings)
#   https://docs.pxxl.app/deploy/functions          (serverless API)
#
# The portal is a PURE STATIC multi-page site — no runtime, no port,
# no health check (per docs.pxxl.app/projects/project-types):
#   /                → portal landing            (dist/index.html)
#   /dashboard/      → React verification dash   (dist/dashboard/)
#   /lab3d/          → Three.js 3D laboratory    (dist/lab3d/)
#   /api/health      → static JSON snapshot      (dist/api/health.json)
#   /api/version     → static JSON snapshot      (dist/api/version.json)
#   /api/zeta        → static JSON snapshot      (dist/api/zeta.json)
#
# DEPLOY-RELIABILITY CONTRACT (v1.5.1):
#   • the build command cannot fail while the committed dist/ exists —
#     scripts/deploy-build.mjs falls back to the last known-good build;
#   • Functions are DISABLED (they require a paid plan — docs.pxxl.app/
#     deploy/functions); the mini-API lives on as static JSON snapshots;
#   • no [[rewrites]] to /api/* — nothing routes into a disabled runtime.
#
# Feature blocks are independent: every [[redirects]] / [[headers]]
# / [functions] block can be deleted on its own without affecting
# the rest.
# ════════════════════════════════════════════════════════════════

version = 1

# ── 1. build ────────────────────────────────────────────────────
# scripts/deploy-build.mjs runs the full rebuild (npm ci → esbuild
# self-heal → both Vite apps → assemble ./dist) and, if ANY step fails
# in the hosted builder (registry hiccup, restricted postinstall, old
# Node…), restores the committed dist/ and STILL exits 0. A deploy of
# this repository can no longer fail at the build stage: worst case it
# ships the last known-good build that is always present in git.
# Deployment target: Static App — output directory, no start command,
# no port, no health check (docs.pxxl.app/projects/project-types).
[build]
command = "node scripts/deploy-build.mjs"
output  = "dist"

# ── 2. serverless functions — DISABLED ──────────────────────────
# Pxxl Functions are "available on paid plans" (docs.pxxl.app/deploy/
# functions). With enabled = true on a plan without them, the deploy
# is rejected before publication — which is exactly what broke every
# production deployment of this repository (63 red ✗ in a row).
#
# The handlers in api/ are kept for the day the plan includes
# Functions: flip enabled to true and re-add the bot-card rewrites
# from git history (see scripts/serve.mjs for the JS ports that the
# Web-Service fallback serves instead). The static site, redirects,
# headers and the static JSON snapshots below are fully independent
# and never depended on this block.
[functions]
enabled = false
root    = "api"
prefix  = "/api"

# ── 3. static mini-API snapshots ────────────────────────────────
# scripts/build-site.mjs freezes the api/*.ts responses into
# dist/api/*.json, and these redirects put them back on the original
# /api/* URLs — so the landing page's status dot (it fetches
# /api/health) and research notebooks keep working on a plan without
# Functions. 307 = temporary: when Functions are re-enabled, delete
# these three blocks and the live handlers take over seamlessly.
[[redirects]]
source      = "/api/health"
destination = "/api/health.json"
status      = 307

[[redirects]]
source      = "/api/version"
destination = "/api/version.json"
status      = 307

[[redirects]]
source      = "/api/zeta"
destination = "/api/zeta.json"
status      = 307

# Bot-aware social previews (the old [[rewrites]] → /api/og blocks)
# were removed together with Functions: on a static-only plan they
# would send crawlers to a dead endpoint. The landing page keeps its
# full static OG/Twitter meta (13 tags in dist/index.html); the Web-
# Service fallback (scripts/serve.mjs) still renders bot cards live.

# ── 4. redirects ────────────────────────────────────────────────
# Canonicalization (308 = permanent, method-preserving). The two
# Vite apps mount at directory prefixes and ship RELATIVE asset
# URLs (vite `base: './'`): they must be opened with a trailing
# slash, or the browser resolves "./assets/…" against the site
# root and renders a blank page.
[[redirects]]
source      = "/dashboard"
destination = "/dashboard/"
status      = 308

[[redirects]]
source      = "/lab3d"
destination = "/lab3d/"
status      = 308

[[redirects]]
source      = "/index.html"
destination = "/"
status      = 308

# Legacy alias kept for older links in docs and chat history.
[[redirects]]
source      = "/lab"
destination = "/lab3d/"
status      = 308

# One-keyboard-key vanity routes (memorable deep links for talks).
[[redirects]]
source      = "/d"
destination = "/dashboard/"
status      = 308

[[redirects]]
source      = "/l"
destination = "/lab3d/"
status      = 308

# Probe endpoints one browser keystroke away — pointed straight at
# the static snapshots so /health stays a single hop on static hosting.
[[redirects]]
source      = "/health"
destination = "/api/health.json"
status      = 307

[[redirects]]
source      = "/zeta"
destination = "/api/zeta.json"
status      = 307

[[redirects]]
source      = "/orcid"
destination = "https://orcid.org/0009-0003-7299-0701"
status      = 307

# Vanity deep links (307 = temporary: the target may move).
[[redirects]]
source      = "/github"
destination = "https://github.com/wild8highlander/ab-cloud-research"
status      = 307

[[redirects]]
source      = "/doi"
destination = "https://doi.org/10.5281/zenodo.21825394"
status      = 307

# ── 5. routing mode ────────────────────────────────────────────
# Deliberately NO spa fallback: the portal is a classic multi-page
# site with a real file at every URL. A SPA fallback would serve
# the landing page for every broken link and mask genuine 404s.
[routing]
spa = false

# ── 6. response headers ─────────────────────────────────────────
# Rule order matters: the universal rule applies security headers
# to EVERY path; the following rules add per-class Cache-Control.
# Cache-Control is intentionally NOT set here for HTML — the static
# edge default keeps HTML revalidation-ready, and every path below
# matches exactly one cache rule (no duplicate header keys).
[[headers]]
source = "/:path*"
[headers.headers]
Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"
Strict-Transport-Security = "max-age=63072000; includeSubDomains"
X-Content-Type-Options    = "nosniff"
X-Frame-Options           = "SAMEORIGIN"
Referrer-Policy           = "strict-origin-when-cross-origin"
Cross-Origin-Opener-Policy  = "same-origin"
Cross-Origin-Resource-Policy = "same-origin"
# credentialless (not require-corp): everything on this site is same-origin,
# so nothing breaks, while Chrome/Firefox gain crossOriginIsolated — which
# unlocks high-resolution timers for the dashboard's Web Worker.
Cross-Origin-Embedder-Policy = "credentialless"
Permissions-Policy        = "camera=(), microphone=(), geolocation=(), gyroscope=(), magnetometer=(), payment=(), usb=(), interest-cohort=()"

# Vite emits content-hashed filenames under /{app}/assets — safe
# to cache forever.
[[headers]]
source = "/dashboard/assets/:path*"
[headers.headers]
Cache-Control = "public, max-age=31536000, immutable"

# Static mini-API snapshots (dist/api/*.json served at /api/* via the
# redirects above): a short TTL keeps monitors honest, and ACAO:* keeps
# the zeta endpoint usable from other groups' notebooks, matching the
# open-data policy of the original Pxxl Function.
[[headers]]
source = "/api/:path*"
[headers.headers]
Cache-Control               = "public, max-age=300"
Access-Control-Allow-Origin = "*"

[[headers]]
source = "/lab3d/assets/:path*"
[headers.headers]
Cache-Control = "public, max-age=31536000, immutable"

# Open research data: short TTL + CORS, so other groups' notebooks
# and tools can fetch the datasets cross-origin.
[[headers]]
source = "/dashboard/data/:path*"
[headers.headers]
Cache-Control              = "public, max-age=300, stale-while-revalidate=86400"
Access-Control-Allow-Origin = "*"

# Brand images and icons: a week is plenty (they change rarely and
# are re-fetched on deploy via SW precache).
[[headers]]
source = "/og-cover.png"
[headers.headers]
Cache-Control = "public, max-age=604800"

[[headers]]
source = "/icon-:path*"
[headers.headers]
Cache-Control = "public, max-age=604800"

[[headers]]
source = "/apple-touch-icon.png"
[headers.headers]
Cache-Control = "public, max-age=604800"

# Web app manifest: re-check hourly, pick up icon/shortcut changes
# within an hour of each deploy.
[[headers]]
source = "/manifest.json"
[headers.headers]
Cache-Control = "public, max-age=3600"

# Service worker MUST revalidate on every fetch, or updates would
# wait up to 24h for the browser's own SW refresh.
[[headers]]
source = "/sw.js"
[headers.headers]
Cache-Control = "public, max-age=0, must-revalidate"

# Portal motion/interaction layer and the particle canvas script:
# short TTL + SWR — edits ship within minutes, SW precache bridges
# the gap for offline users.
[[headers]]
source = "/portal.js"
[headers.headers]
Cache-Control = "public, max-age=300, stale-while-revalidate=86400"

[[headers]]
source = "/particles.js"
[headers.headers]
Cache-Control = "public, max-age=300, stale-while-revalidate=86400"

# Favicon is re-read weekly; SVG is tiny so revalidation cost is nil.
[[headers]]
source = "/favicon.svg"
[headers.headers]
Cache-Control = "public, max-age=604800"

# PWA install screenshots (added for richer install prompts).
[[headers]]
source = "/screenshots/:path*"
[headers.headers]
Cache-Control = "public, max-age=604800"

# Generated SEO files (build-time, from SITE_URL) and discovery files.
[[headers]]
source = "/sitemap.xml"
[headers.headers]
Cache-Control = "public, max-age=3600"

[[headers]]
source = "/robots.txt"
[headers.headers]
Cache-Control = "public, max-age=86400"
