<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="84" viewBox="0 0 1200 84" role="img" aria-label="Rotating gear driving the wave-attractors workflow">
<defs><filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1224"/><stop offset="1" stop-color="#070b16"/></linearGradient></defs>
<rect x="1.5" y="1.5" width="1197" height="81" rx="14" fill="url(#bg1)" stroke="#1c2740" stroke-width="1.4"/>
<g><animateTransform attributeName="transform" type="rotate" values="0 140 42;360 140 42" dur="16s" repeatCount="indefinite"/>
<rect x="136" y="8" width="8" height="14" rx="2" fill="#a78bfa" opacity="0.9" transform="rotate(0 140 42)"/><rect x="136" y="8" width="8" height="14" rx="2" fill="#a78bfa" opacity="0.9" transform="rotate(36 140 42)"/><rect x="136" y="8" width="8" height="14" rx="2" fill="#a78bfa" opacity="0.9" transform="rotate(72 140 42)"/><rect x="136" y="8" width="8" height="14" rx="2" fill="#a78bfa" opacity="0.9" transform="rotate(108 140 42)"/><rect x="136" y="8" width="8" height="14" rx="2" fill="#a78bfa" opacity="0.9" transform="rotate(144 140 42)"/><rect x="136" y="8" width="8" height="14" rx="2" fill="#a78bfa" opacity="0.9" transform="rotate(180 140 42)"/><rect x="136" y="8" width="8" height="14" rx="2" fill="#a78bfa" opacity="0.9" transform="rotate(216 140 42)"/><rect x="136" y="8" width="8" height="14" rx="2" fill="#a78bfa" opacity="0.9" transform="rotate(252 140 42)"/><rect x="136" y="8" width="8" height="14" rx="2" fill="#a78bfa" opacity="0.9" transform="rotate(288 140 42)"/><rect x="136" y="8" width="8" height="14" rx="2" fill="#a78bfa" opacity="0.9" transform="rotate(324 140 42)"/><circle cx="140" cy="42" r="24" fill="none" stroke="#a78bfa" stroke-width="3"/>
<circle cx="140" cy="42" r="8" fill="none" stroke="#a78bfa" stroke-width="2"/></g>
<line x1="170" y1="42" x2="1040" y2="42" stroke="#1c2740" stroke-width="2"/>
<line x1="170" y1="42" x2="1040" y2="42" stroke="#00e5ff" stroke-width="1.2" stroke-dasharray="10 14">
<animate attributeName="stroke-dashoffset" from="0" to="-240" dur="6s" repeatCount="indefinite"/></line>
<circle cx="1058" cy="42" r="9" fill="#0b1520" stroke="#00e5ff" stroke-width="2">
<animate attributeName="stroke-width" values="2;3.8;2" dur="2s" repeatCount="indefinite"/></circle>
<text x="600" y="72" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#6f97a4">wave-attractors.yml</text>
</svg>
