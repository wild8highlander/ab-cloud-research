<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="72" viewBox="0 0 1152 72" role="img" aria-label="Animated footer wave: the zeta critical strip flowing as a light wave beneath three package seals">
  <title>AB-Cloud academic package footer wave</title>
  <defs>
    <linearGradient id="wf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B7E5A"/>
      <stop offset="30%" stop-color="#C9B97E"/>
      <stop offset="55%" stop-color="#7FC8A8"/>
      <stop offset="80%" stop-color="#7FA8D0"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
  </defs>

  <!-- the wave: zeta-like oscillation -->
  <path d="M0 36 Q 72 12, 144 36 T 288 36 T 432 36 T 576 36 T 720 36 T 864 36 T 1008 36 T 1152 36"
        fill="none" stroke="url(#wf)" stroke-width="2.2" stroke-linecap="round" opacity="0.85"
        stroke-dasharray="8 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-224" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0.95;0.55" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- mirrored faint echo -->
  <path d="M0 44 Q 72 64, 144 44 T 288 44 T 432 44 T 576 44 T 720 44 T 864 44 T 1008 44 T 1152 44"
        fill="none" stroke="#7FA8D0" stroke-width="1.2" opacity="0.3">
    <animate attributeName="stroke-dashoffset" from="0" to="224" dur="9s" repeatCount="indefinite"/>
  </path>

  <!-- particles: zeros riding the wave -->
  <g>
    <circle cx="0" cy="36" r="3" fill="#C9B97E">
      <animateMotion dur="7s" repeatCount="indefinite" path="M0 36 Q 72 12, 144 36 T 288 36 T 432 36 T 576 36 T 720 36 T 864 36 T 1008 36 T 1152 36"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="36" r="2.4" fill="#7FC8A8">
      <animateMotion dur="11s" begin="-4s" repeatCount="indefinite" path="M0 36 Q 72 12, 144 36 T 288 36 T 432 36 T 576 36 T 720 36 T 864 36 T 1008 36 T 1152 36"/>
    </circle>
    <circle cx="0" cy="44" r="2.4" fill="#00E5FF">
      <animateMotion dur="13s" begin="-8s" repeatCount="indefinite" path="M0 44 Q 72 64, 144 44 T 288 44 T 432 44 T 576 44 T 720 44 T 864 44 T 1008 44 T 1152 44"/>
    </circle>
  </g>

  <!-- three seals on the wave: New / Old / Journal -->
  <g font-family="'Inter','Helvetica Neue',Arial,sans-serif" text-anchor="middle">
    <circle cx="408" cy="36" r="12" fill="#0B1F35" stroke="#7FC8A8" stroke-width="1.4" opacity="0.9">
      <animate attributeName="r" values="11;13;11" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="408" y="40" font-size="10" fill="#7FC8A8" font-weight="700">N</text>
    <circle cx="576" cy="36" r="12" fill="#0B1F35" stroke="#C9B97E" stroke-width="1.4" opacity="0.9">
      <animate attributeName="r" values="11;13;11" dur="4s" begin="-1.3s" repeatCount="indefinite"/>
    </circle>
    <text x="576" y="40" font-size="10" fill="#E8DDB8" font-weight="700">O</text>
    <circle cx="744" cy="36" r="12" fill="#0B1F35" stroke="#7FA8D0" stroke-width="1.4" opacity="0.9">
      <animate attributeName="r" values="11;13;11" dur="4s" begin="-2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="744" y="40" font-size="10" fill="#7FA8D0" font-weight="700">J</text>
  </g>
</svg>
