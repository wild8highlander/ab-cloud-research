<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" width="200" height="230">
  <!-- Hilbert–Pólya Bridge avatar cast · Riemann · geometric duotone style -->
  <defs>
    <clipPath id="badgeClip"><circle cx="100" cy="92" r="86"/></clipPath>
  </defs>
  <circle cx="100" cy="92" r="90" fill="#0B1E3A"/>
  <circle cx="100" cy="92" r="86" fill="#F5EDE0" stroke="#E8A33D" stroke-width="4"/>
  <g clip-path="url(#badgeClip)">
    <!-- shoulders: 19th-century dark coat -->
    <path d="M100 150 C 60 150 34 172 30 210 L 170 210 C 166 172 140 150 100 150 Z" fill="#0B1E3A"/>
    <path d="M100 150 L 84 158 L 100 186 L 116 158 Z" fill="#F5EDE0"/>
    <path d="M92 152 L 100 170 L 108 152 Z" fill="#8C2F2F"/>
    <!-- head -->
    <ellipse cx="100" cy="96" rx="34" ry="40" fill="#E8C39E"/>
    <!-- ears -->
    <ellipse cx="64" cy="100" rx="7" ry="11" fill="#E8C39E"/>
    <ellipse cx="136" cy="100" rx="7" ry="11" fill="#E8C39E"/>
    <!-- hair: side-parted, 19th century -->
    <path d="M66 88 C 64 54 84 46 100 46 C 120 46 136 56 134 84 C 126 66 116 62 100 62 C 84 62 72 70 66 88 Z" fill="#3A2A1E"/>
    <!-- mutton-chop whiskers -->
    <path d="M66 92 C 62 104 64 118 72 126 L 78 120 C 72 112 70 102 72 94 Z" fill="#3A2A1E"/>
    <path d="M134 92 C 138 104 136 118 128 126 L 122 120 C 128 112 130 102 128 94 Z" fill="#3A2A1E"/>
    <!-- mouth -->
    <path d="M88 122 Q 100 128 112 122" stroke="#8A5A3B" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- eyes -->
    <circle cx="86" cy="98" r="3.4" fill="#0B1E3A"/>
    <circle cx="114" cy="98" r="3.4" fill="#0B1E3A"/>
    <path d="M80 90 Q 86 87 92 90" stroke="#3A2A1E" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M108 90 Q 114 87 120 90" stroke="#3A2A1E" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  </g>
  <!-- emblem: zeta function -->
  <circle cx="152" cy="158" r="20" fill="#E8A33D" stroke="#0B1E3A" stroke-width="3"/>
  <text x="152" y="166" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-style="italic" fill="#0B1E3A">&#950;</text>
  <!-- name plate -->
  <rect x="24" y="196" width="152" height="26" rx="13" fill="#0B1E3A"/>
  <text x="100" y="214" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" letter-spacing="1.5" fill="#F5EDE0">B. RIEMANN</text>
</svg>
