    <rect x="0" y="14" width="470" height="10" fill="#1e142e"/>
    <circle cx="15" cy="12" r="4" fill="#ff5f57"/>
    <circle cx="30" cy="12" r="4" fill="#febc2e"/>
    <circle cx="45" cy="12" r="4" fill="#28c840"/>
    <text x="130" y="16" font-family="'Courier New',monospace" font-size="11" fill="#8a7aa8">julia code/ab_cloud_full.jl --test all</text>
    <g font-family="'Courier New',monospace" font-size="12.5" fill="#d8ccf0">
      <text x="16" y="44">◆ AB-CLOUD v23 · SUITE · 39 tests · two-pass</text>
      <text x="16" y="66">[1–3]  b(N) convergence ....... <tspan fill="#4caf50">PASS</tspan></text>
