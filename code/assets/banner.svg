  <text x="620" y="150" font-family="Georgia,serif" font-size="13" font-style="italic" fill="#6a5a88">b(50000) = 1.2126 · KS = 0.047 (p = 0.27) · Byers–Yang 3.5·10⁻¹⁵</text>
  <text x="620" y="172" font-family="Georgia,serif" font-size="13" font-style="italic" fill="#6a5a88">H1–H7 gates · Physics Lab · 3D Lab · Test 34G on 7 surfaces</text>
  <text x="620" y="194" font-family="Georgia,serif" font-size="13" font-style="italic" fill="#6a5a88">report engine: md · html · pdf · docx · png · gif</text>
  <text x="620" y="216" font-family="Georgia,serif" font-size="13" font-style="italic" fill="#6a5a88">seeds fixed → byte-identical reruns</text>

  <g font-family="'Courier New',monospace" font-size="13.5" fill="#8a7aa8">
