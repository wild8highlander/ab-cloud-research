<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="CODE — THE CANONICAL SUITE — animated banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120a1c"/>
      <stop offset="0.55" stop-color="#1c1033"/>
      <stop offset="1" stop-color="#100a1a"/>
    </linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9a0ff"/>
      <stop offset="0.5" stop-color="#f2eaff"/>
      <stop offset="1" stop-color="#7fd7c4"/>
      <animate attributeName="x1" values="-0.6;0.4" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.4;1.4" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.4" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5a2a9a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5a2a9a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1c1430" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="14" fill="url(#grid)" opacity="0.5"/>
  <rect width="1200" height="300" rx="14" fill="url(#halo)"/>
  <rect x="1.5" y="1.5" width="1197" height="297" rx="13" fill="none" stroke="#33244f" stroke-width="1.4" opacity="0.8"/>

  <text x="64" y="74" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" letter-spacing="2.2" fill="url(#tg)">CODE — THE CANONICAL SUITE</text>
  <text x="66" y="104" font-family="Georgia, serif" font-size="16.5" font-style="italic" fill="#a894c4">ab_cloud_full.jl — the single-file numerical program that produces every number the monographs quote</text>

  <g transform="translate(64,138)">
    <rect x="0" y="0" width="470" height="150" rx="10" fill="#160e26" stroke="#4a3a6c" stroke-width="1.8"/>
