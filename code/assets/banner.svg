    </g>
    <g font-family="'Courier New',monospace" font-size="13" fill="#5a4a7a">
      <text x="16" y="134">▰▰▰▱▱▱▱▱▱▱</text>
      <text x="16" y="134" fill="#c9a0ff">
        <animate attributeName="opacity" values="0;1" dur="2.6s" repeatCount="indefinite"/>
      </text>
      <g>
        <text x="16" y="134" fill="#4caf50">▰▰▰</text>
        <text x="16" y="134"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.3;0.45;0.6;1" dur="3.4s" repeatCount="indefinite"/>▰</text>
      </g>
    </g>
    <rect x="16" y="144" width="9" height="14" fill="#c9a0ff">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <text x="240" y="155" font-family="'Courier New',monospace" font-size="11" fill="#6a5a88">pass 1 · 72×72</text>
  </g>  <g transform="translate(960,196)">
    <circle cx="-56" cy="-16" r="24" fill="none" stroke="#e88a6a" stroke-width="2.2">
      <animate attributeName="r" values="22;26;22" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-20" cy="-36" r="24" fill="none" stroke="#8a6ae8" stroke-width="2.2">
