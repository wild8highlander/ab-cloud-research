    <circle cx="760" cy="2600" r="14"/><circle cx="1040" cy="2600" r="14"/><circle cx="760" cy="2860" r="14"/><circle cx="1040" cy="2860" r="14"/>
  </g>
  <circle cx="900" cy="2730" r="70" fill="#0B1F35" stroke="#C9B97E" stroke-width="5"/>
