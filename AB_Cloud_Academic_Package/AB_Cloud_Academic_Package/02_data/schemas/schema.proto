syntax = "proto3";
package abcloud.package;

enum VerdictKind { UNKNOWN = 0; YES = 1; NO = 2; BLOCKED = 3; }

message Verdict {
  string id = 1;
  VerdictKind verdict = 2;
  string basis = 3;
  optional string does_not_prove = 4;
}

message FlagshipResult {
  int32 id = 1;
  string result = 2;
  string numbers = 3;   // verbatim, from source verdict files
  string level = 4;
}

message ResearchRegistry {
  string programme_name = 1;
  string edition = 2;
  string rh_status = 3; // always "blocked" (V13)
  repeated FlagshipResult flagship_results = 4;
  repeated Verdict verdicts = 5;
}
