[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abcloud-unified-package"
description = "Unified academic package of the AB-Cloud research programme (spectral core, Dirac skeleton, Hilbert-Pólya bridge, blind verification)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT (code) / CC-BY-4.0 (text) / ODbL (data)" }
authors = [{ name = "Isaev Iskhak Khamzatovich" }]
keywords = ["riemann-zeta", "hilbert-polya", "aharonov-bohm", "dirac", "gue", "verification"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
full = ["rich>=13.0", "typer>=0.9", "matplotlib>=3.7", "mpmath>=1.3", "pandas>=2.0"]
web = ["streamlit>=1.30", "fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=7.0", "ruff>=0.4", "jsonschema>=4.18"]

[project.scripts]
abcloud = "abcloud_python.run:app"

[tool.setuptools]
packages = { find = { where = ["06_code/python"], include = ["abcloud_python*"] } }

[tool.pytest.ini_options]
testpaths = ["09_tests/python"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
