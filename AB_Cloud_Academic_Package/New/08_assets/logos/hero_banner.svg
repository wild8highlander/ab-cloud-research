<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="300" viewBox="0 0 1152 300" role="img" aria-label="AB-Cloud Research — Unified Academic Package hero banner: an animated Aharonov-Bohm lattice with a pulsing zeta node on the critical line">
  <title>AB-Cloud Research — Unified Academic Package</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#081527"/>
      <stop offset="50%" stop-color="#0B1F35"/>
      <stop offset="100%" stop-color="#123252"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B7E5A"/>
      <stop offset="50%" stop-color="#E8DDB8"/>
      <stop offset="100%" stop-color="#8B7E5A"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8DDB8" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#C9B97E" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#C9B97E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1152" height="300" rx="16" fill="url(#bg)"/>

  <!-- AB lattice grid -->
  <g stroke="#7FA8D0" stroke-width="1" opacity="0.16" fill="none">
    <path d="M96 60 H1056"/><path d="M96 120 H1056"/><path d="M96 180 H1056"/><path d="M96 240 H1056"/>
    <path d="M192 24 V276"/><path d="M384 24 V276"/><path d="M576 24 V276"/><path d="M768 24 V276"/><path d="M960 24 V276"/>
  </g>
  <!-- flux nodes at intersections -->
  <g fill="#C9B97E" opacity="0.5">
    <circle cx="192" cy="60" r="2.5"/><circle cx="384" cy="60" r="2.5"/><circle cx="768" cy="60" r="2.5"/><circle cx="960" cy="60" r="2.5"/>
    <circle cx="192" cy="120" r="2.5"/><circle cx="960" cy="120" r="2.5"/>
    <circle cx="192" cy="240" r="2.5"/><circle cx="384" cy="240" r="2.5"/><circle cx="768" cy="240" r="2.5"/><circle cx="960" cy="240" r="2.5"/>
  </g>
  <!-- neon intersections breathing -->
  <g fill="#00E5FF">
    <circle cx="576" cy="60" r="3">
      <animate attributeName="opacity" values="0.15;0.9;0.15" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="576" cy="240" r="3">
      <animate attributeName="opacity" values="0.9;0.15;0.9" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- critical line -->
  <line x1="576" y1="36" x2="576" y2="264" stroke="#E8DDB8" stroke-width="1.4" stroke-dasharray="3 7" opacity="0.6">
    <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="6s" repeatCount="indefinite"/>
  </line>

  <!-- zeros travelling along the critical line -->
  <g fill="#7FC8A8">
    <circle cx="576" cy="60" r="4">
      <animate attributeName="cy" values="60;204;60" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;1;0.35" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="576" cy="132" r="3.4">
      <animate attributeName="cy" values="132;252;132" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="576" cy="216" r="3.4">
      <animate attributeName="cy" values="216;84;216" dur="13s" repeatCount="indefinite"/>
    </circle>
  </g>
  <circle cx="576" cy="180" r="4.4" fill="#00E5FF">
    <animate attributeName="cy" values="180;60;180" dur="15s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="15s" repeatCount="indefinite"/>
  </circle>

  <!-- central zeta node with pulsing glow -->
  <circle cx="576" cy="150" r="86" fill="url(#nodeGlow)">
    <animate attributeName="r" values="78;96;78" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </circle>
  <circle cx="576" cy="150" r="46" fill="#0B1F35" stroke="url(#gold)" stroke-width="2.6"/>
  <text x="576" y="169" font-family="Georgia, 'Times New Roman', serif" font-size="56" fill="#E8DDB8" text-anchor="middle" font-style="italic">&#950;</text>

  <!-- orbital ring around the node -->
  <ellipse cx="576" cy="150" rx="120" ry="34" fill="none" stroke="#7FA8D0" stroke-width="1" opacity="0.35" stroke-dasharray="2 6">
    <animate attributeName="stroke-dashoffset" from="0" to="48" dur="8s" repeatCount="indefinite"/>
  </ellipse>
  <circle cx="456" cy="150" r="3" fill="#C9B97E">
    <animateMotion dur="8s" repeatCount="indefinite" path="M 456 150 A 120 34 0 1 0 696 150 A 120 34 0 1 0 456 150"/>
  </circle>

  <!-- travelling circuit pulses -->
  <g>
    <circle cx="0" cy="60" r="2.6" fill="#00E5FF">
      <animate attributeName="cx" from="96" to="1056" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="240" r="2.6" fill="#7FC8A8">
      <animate attributeName="cx" from="1056" to="96" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- vertical scan sweep -->
  <rect x="0" y="0" width="3" height="300" fill="url(#scan)" opacity="0">
    <animate attributeName="x" from="60" to="1092" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="12s" repeatCount="indefinite" keyTimes="0;0.5;1"/>
  </rect>

  <!-- typography -->
  <text x="576" y="46" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">AB-CLOUD RESEARCH</text>
  <text x="576" y="278" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#C9B97E" text-anchor="middle" letter-spacing="5">UNIFIED ACADEMIC PACKAGE &#183; ONE STUDY &#183; TEN LEVELS &#183; HONEST BOUNDARIES</text>
  <text x="576" y="294" font-family="Georgia, serif" font-size="11.5" fill="#7FA8D0" text-anchor="middle" font-style="italic">V01&#8211;V20 &#183; D1&#8211;D14 &#183; C1&#8211;C16 &#183; T1&#8211;T18 &#183; E01&#8211;E18 &#183; ES1&#8211;ES5 &#183; H1&#8211;H7 &#183; W1</text>

  <!-- gold frame with flowing dashes -->
  <rect x="0" y="0" width="1152" height="7" rx="3.5" fill="url(#gold)" opacity="0.9">
    <animate attributeName="opacity" values="0.65;1;0.65" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="293" width="1152" height="7" rx="3.5" fill="url(#gold)" opacity="0.9">
    <animate attributeName="opacity" values="1;0.65;1" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
