<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="MONOGRAPHS — THE WRITTEN OUTCOMES — animated banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1208"/>
      <stop offset="0.55" stop-color="#2c1d10"/>
      <stop offset="1" stop-color="#170e05"/>
    </linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8b56a"/>
      <stop offset="0.5" stop-color="#f7ecd8"/>
      <stop offset="1" stop-color="#c96f4a"/>
      <animate attributeName="x1" values="-0.6;0.4" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.4;1.4" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.35" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9a5a1a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#9a5a1a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#2a1d10" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="14" fill="url(#grid)" opacity="0.5"/>
  <rect width="1200" height="300" rx="14" fill="url(#halo)"/>
  <rect x="1.5" y="1.5" width="1197" height="297" rx="13" fill="none" stroke="#4e3820" stroke-width="1.4" opacity="0.8"/>

  <text x="64" y="74" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" letter-spacing="2.2" fill="url(#tg)">MONOGRAPHS — THE WRITTEN OUTCOMES</text>
  <text x="66" y="104" font-family="Georgia, serif" font-size="16.5" font-style="italic" fill="#c9ae86">five editions with a trilingual core — the complete written record of the project</text>

  <g transform="translate(470,120)">
    <rect x="0" y="0" width="34" height="118" rx="3" fill="#8a2f2a" stroke="#e0c9a0" stroke-width="1.4"/>
    <text x="17" y="62" transform="rotate(-90 17 62)" text-anchor="middle" font-family="Georgia,serif" font-size="13" font-weight="700" fill="#f7ecd8">RU · v22</text>
    <rect x="40" y="-6" width="34" height="124" rx="3" fill="#2a4a72" stroke="#e0c9a0" stroke-width="1.4"/>
    <text x="57" y="58" transform="rotate(-90 57 58)" text-anchor="middle" font-family="Georgia,serif" font-size="13" font-weight="700" fill="#f7ecd8">EN · v22</text>
    <rect x="80" y="0" width="34" height="118" rx="3" fill="#2f6a45" stroke="#e0c9a0" stroke-width="1.4"/>
    <text x="97" y="62" transform="rotate(-90 97 62)" text-anchor="middle" font-family="Georgia,serif" font-size="13" font-weight="700" fill="#f7ecd8">ZH · v22</text>
    <!-- полка -->
    <rect x="-14" y="118" width="142" height="8" rx="3" fill="#5e4426"/>
    <text x="-12" y="142" font-family="Georgia,serif" font-size="12.5" font-style="italic" fill="#8a704e">one text · three languages</text>
  </g>  <g transform="translate(680,140)">
    <path d="M0 76 C18 66 42 66 60 76 L60 8 C42 -2 18 -2 0 8 Z" fill="#f2e8d4" stroke="#a88a5e" stroke-width="1.6"/>
    <line x1="30" y1="6" x2="30" y2="74" stroke="#a88a5e" stroke-width="1.2" opacity="0.7"/>
    <g>
      <animate attributeName="opacity" values="0;1;1;0" dur="4.5s" repeatCount="indefinite"/>
      <path d="M60 8 C78 -2 102 -2 120 8 L120 76 C102 66 78 66 60 76 Z" fill="#e8dcc4" stroke="#a88a5e" stroke-width="1.4">
        <animateTransform attributeName="transform" type="scale" values="1 1;0.12 1;1 1" dur="4.5s" repeatCount="indefinite" additive="sum"/>
      </path>
    </g>
    <text x="6" y="96" font-family="Georgia,serif" font-size="12.5" font-style="italic" fill="#8a704e">md · tex · html · docx · pdf · pptx · preprint</text>
  </g>  <g transform="translate(860,196)">
    <line x1="0" y1="0" x2="240" y2="0" stroke="#8a704e" stroke-width="2"/>
    <circle cx="10" cy="0" r="5" fill="#a88a5e"><animate attributeName="r" values="4;6;4" dur="3s" repeatCount="indefinite"/></circle>
    <text x="-2" y="-12" font-family="'Courier New',monospace" font-size="11.5" fill="#a88a5e">v21</text>
    <circle cx="86" cy="0" r="5" fill="#a88a5e"><animate attributeName="r" values="4;6;4" dur="3s" begin="0.6s" repeatCount="indefinite"/></circle>
    <text x="74" y="-12" font-family="'Courier New',monospace" font-size="11.5" fill="#a88a5e">v21.1</text>
    <circle cx="170" cy="0" r="6.5" fill="#7fb069"><animate attributeName="r" values="5.5;8;5.5" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.6;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <text x="158" y="-14" font-family="'Courier New',monospace" font-size="11.5" fill="#a8d8a0" font-weight="700">v22.1 ✓</text>
    <text x="-6" y="26" font-family="Georgia,serif" font-size="12.5" font-style="italic" fill="#8a704e">history → errata → canonical build</text>
  </g>
  <!-- формула на парящей карточке -->
  <g transform="translate(180,170)">
    <rect x="0" y="0" width="180" height="64" rx="6" fill="#241a10" stroke="#5e4426" stroke-width="1.2"/>
    <text x="14" y="27" font-family="Georgia,serif" font-size="17" font-style="italic" fill="#e8b56a">⟨r⟩ → 0.5996</text>
    <text x="14" y="48" font-family="'Courier New',monospace" font-size="11" fill="#a88a5e">GUE β=2 · every number</text>
    <text x="14" y="60" font-family="'Courier New',monospace" font-size="11" fill="#a88a5e">bound to a named test</text>
    <animateTransform attributeName="transform" type="translate" values="180 170;180 162;180 170" dur="5s" repeatCount="indefinite" additive="replace"/>
  </g>

  <g font-family="'Courier New',monospace" font-size="13.5" fill="#a88a5e">
    <text x="64" y="278">v22 → v22.1 canonical · RU / EN / ZH · md tex html docx pdf pptx preprint · 19–20 figures at 600 dpi per language</text>
  </g>
</svg>
